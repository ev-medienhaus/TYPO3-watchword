<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
    <h1><f:translate key="module.import.title" extensionName="Watchword" /></h1>

    <p>{f:translate(key: 'module.import.hint', extensionName: 'Watchword')}</p>

    <form action="{importUrl}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file"><f:translate key="module.import.file_label" extensionName="Watchword" /></label>
            <input type="file" name="file" id="file" class="form-control" accept=".xlsx,.xls,.csv" required="required" />
        </div>
        <br />
        <button type="submit" class="btn btn-primary"><f:translate key="module.import.submit" extensionName="Watchword" /></button>
        <f:link.action action="index" class="btn btn-default"><f:translate key="module.import.back" extensionName="Watchword" /></f:link.action>
    </form>
</f:section>
</html>
